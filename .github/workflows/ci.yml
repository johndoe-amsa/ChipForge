name: CI

on:
  push:
  pull_request:

# Droits minimaux : lecture du dépôt uniquement.
permissions:
  contents: read

concurrency:
  group: ci-${{ github.ref }}
  cancel-in-progress: true

jobs:
  verify:
    runs-on: ubuntu-latest
    timeout-minutes: 20
    steps:
      # Actions figées sur un SHA de commit (protection contre une réécriture de tag).
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
          cache: npm
      # .npmrc : ignore-scripts=true (aucun script d'installation tiers exécuté)
      - run: npm ci
      - name: Audit des dépendances
        run: npm audit --audit-level=low
      - name: Vérification des types
        run: npm run typecheck
      - name: Tests (géométrie, exports, relecture STEP OpenCascade, sécurité)
        run: npm test
      - name: Build + contrôle du bundle (aucune ressource externe, CSP présente)
        run: npm run build
