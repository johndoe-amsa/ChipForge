<!doctype html>
<html lang="fr">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <meta name="referrer" content="no-referrer" />
    <meta name="robots" content="noindex, nofollow" />
    <meta name="description" content="ChipForge — générateur paramétrique de copeaux d'usinage 3D (OBJ / STEP) pour le rendu." />
    <meta name="color-scheme" content="dark" />
    <link rel="icon" type="image/svg+xml" href="./favicon.svg" />
    <title>ChipForge</title>
  </head>
  <body>
    <noscript><p class="cf-fatal">ChipForge nécessite JavaScript et WebGL.</p></noscript>
    <div class="cf-app">
      <header id="topbar" class="cf-topbar"></header>
      <div class="cf-workspace">
        <nav id="rail" class="cf-rail" aria-label="Panneaux"></nav>
        <aside id="sidebar" class="cf-sidebar" aria-label="Volet latéral"></aside>
        <main id="viewport" class="cf-viewport" aria-label="Vue 3D"></main>
      </div>
      <footer id="statusbar" class="cf-statusbar"></footer>
    </div>
    <div id="toasts" class="cf-toasts" aria-live="polite"></div>
    <script type="module" src="/src/main.ts"></script>
  </body>
</html>
